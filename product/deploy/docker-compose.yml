# Optional PostgreSQL + pgvector only.
# CommandBox on the host remains the default application runtime.
# Encrypted originals stay in product/app/storage/blobs. MinIO is not used.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: idochive
      POSTGRES_USER: idochive
      POSTGRES_PASSWORD: ${IDOCHIVE_DB_PASSWORD:-idochive_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - idochive_pg:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idochive -d idochive"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  idochive_pg:
